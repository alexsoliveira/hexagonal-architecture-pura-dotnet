services:
  # ──────────────────────────────────────────────────────────────
  # SQL Server 2022 Container
  # ──────────────────────────────────────────────────────────────
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: hexagonal-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "${DB_PASSWORD}"
      MSSQL_PID: "Developer"
      MSSQL_COLLATION: "Latin1_General_CI_AS"
    ports:
      - "${DB_PORT:-1433}:1433"
    volumes:
      # Persistência de dados via named volume
      - sqlserver_data:/var/opt/mssql
      # Scripts de inicialização
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - hexagonal-network
    healthcheck:
      test: [
        "CMD",
        "/opt/mssql-tools18/bin/sqlcmd",
        "-S",
        "127.0.0.1",
        "-U",
        "sa",
        "-P",
        "${DB_PASSWORD}",
        "-C",
        "-Q",
        "SELECT 1"
      ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  # ──────────────────────────────────────────────────────────────
  # HexagonalLab API Container
  # ──────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: ./src/HexagonalLab.API/Dockerfile
    container_name: hexagonal-api
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT:-Development}"
      ConnectionStrings__DefaultConnection: "Server=sqlserver;Database=${DB_NAME:-HexagonalLab};User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=true;"
    ports:
      - "${API_PORT:-5000}:8080"
    networks:
      - hexagonal-network
    restart: unless-stopped

  # ──────────────────────────────────────────────────────────────
  # HexagonalLab Worker Container (Background Service)
  # ──────────────────────────────────────────────────────────────
  worker:
    build:
      context: .
      dockerfile: ./src/HexagonalLab.Worker/Dockerfile
    container_name: hexagonal-worker
    depends_on:
      sqlserver:
        condition: service_healthy
      api:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT:-Development}"
      ConnectionStrings__DefaultConnection: "Server=sqlserver;Database=${DB_NAME:-HexagonalLab};User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=true;"
      DOTNET_SYSTEM_CONSOLE_ALLOWDIRECTPARSE: "false"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    volumes:
      - ./logs/worker:/app/logs
    networks:
      - hexagonal-network
    restart: unless-stopped

# ──────────────────────────────────────────────────────────────
# Networks
# ──────────────────────────────────────────────────────────────
networks:
  hexagonal-network:
    driver: bridge

# ──────────────────────────────────────────────────────────────
# Volumes
# ──────────────────────────────────────────────────────────────
volumes:
  sqlserver_data:
    driver: local
